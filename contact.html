<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل معنا | شام ترافل للسياحة والسفر</title>
  <meta name="description" content="شام ترافل للسياحة والسفر - تذاكر طيران، حجز فنادق، تأشيرات، رحلات سياحية وعمرة بأفضل الأسعار وخدمة موثوقة.">
  <meta name="theme-color" content="#f5faff">
  <link rel="icon" href="assets/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&family=Montserrat:wght@600;700;800&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-loading" data-page="contact">

  <div class="preloader">
    <div class="preloader__inner">
      <div class="preloader__logo"><img src="assets/logo.png" alt=""></div>
      <div class="preloader__bar"><i></i></div>
      <div class="preloader__txt">0%</div>
    </div>
  </div>

    <main>
    <section class="page-hero">
      <div class="page-hero__bg" data-art="pattern"></div>
      <div class="container">
        <span class="eyebrow both" data-reveal="up">نحن هنا لخدمتك</span>
        <h1 class="page-hero__title"><span class="word-reveal metal-shine">تواصل معنا</span></h1>
        <p class="lead" style="margin-inline:auto" data-reveal="up">زورونا في المكتب أو راسلونا — يسعدنا الإجابة عن جميع استفساراتكم.</p>
        <div class="crumbs" data-reveal="up"><a href="index.html">الرئيسية</a><span>/</span>تواصل معنا</div>
      </div>
    </section>

    <section class="section">
      <div class="container split" style="align-items:start">
        <div>
          <span class="eyebrow" data-reveal="up">معلومات التواصل</span>
          <h2 class="h-1 split-words" style="margin:14px 0 30px">نسعد <span class="metal">بتواصلكم</span></h2>
          <div class="contact-cards">
            <a class="c-card" data-tel data-reveal="up"><div class="card__icon" data-icon="phone"></div><div><small>اتصل بنا</small><b data-site="phone"></b></div></a>
            <a class="c-card" data-wa="السلام عليكم" data-reveal="up" style="--rd:.06s"><div class="card__icon" data-icon="whatsapp"></div><div><small>واتساب</small><b data-site="phone"></b></div></a>
            <a class="c-card mailto" data-reveal="up" style="--rd:.12s"><div class="card__icon" data-icon="mail"></div><div><small>البريد الإلكتروني</small><b data-site="email"></b></div></a>
            <div class="c-card" data-reveal="up" style="--rd:.18s"><div class="card__icon" data-icon="pin"></div><div><small>العنوان</small><b data-site="address"></b></div></div>
            <div class="c-card" data-reveal="up" style="--rd:.24s"><div class="card__icon" data-icon="clock"></div><div><small>أوقات الدوام</small><b data-site="hours" style="font-size:15px"></b></div></div>
          </div>
          <div class="socials" style="margin-top:26px" data-reveal="up">
            <a class="fb" target="_blank" rel="noopener" aria-label="فيسبوك" data-icon="facebook"></a>
            <a class="ig" target="_blank" rel="noopener" aria-label="انستغرام" data-icon="instagram"></a>
          </div>
        </div>

        <form class="form-card" id="contact-form" novalidate data-reveal="up" style="--rd:.15s">
          <h2 class="h-2" style="margin-bottom:24px">أرسل لنا رسالة</h2>
          <div class="form-grid">
            <div class="field"><label>الاسم *</label><input name="name" required><div class="msg">مطلوب</div></div>
            <div class="field"><label>رقم الهاتف *</label><input name="phone" type="tel" required dir="ltr" style="text-align:right"><div class="msg">مطلوب</div></div>
            <div class="field full"><label>الموضوع</label>
              <select name="subject"><option>تذاكر طيران</option><option>رحلة سياحية</option><option>حجز فندق</option><option>تأشيرة</option><option>شهر عسل</option><option>عمرة</option><option>أخرى</option></select></div>
            <div class="field full"><label>رسالتك *</label><textarea name="message" required></textarea><div class="msg">مطلوب</div></div>
          </div>
          <button type="submit" class="btn btn--primary btn--block" style="margin-top:22px" data-magnetic><span data-icon="whatsapp" style="display:contents"></span> إرسال عبر واتساب</button>
        </form>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container">
        <div class="map" data-reveal="clip" id="map"></div>
      </div>
    </section>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelector(".mailto").href = "mailto:" + SITE.email;
      document.querySelector(".socials .fb").href = SITE.facebook;
      document.querySelector(".socials .ig").href = SITE.instagram;
      document.getElementById("map").innerHTML = '<iframe loading="lazy" title="الموقع على الخريطة" src="https://maps.google.com/maps?q=' + encodeURIComponent(SITE.mapQuery) + '&z=14&output=embed"></iframe>';
    });
  </script>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
